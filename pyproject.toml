[project]
name = "lexisg"
version = "0.0.1"
description = "The LEXI-SG package"
license = { text="GPL-3.0-only" }
requires-python = "==3.11.*"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
# Intentionally empty: this package is always installed with `--no-deps`
# (see docker/entrypoint.sh and scripts/setup_env.sh), because dependencies
# come from docker/requirements.lexisg.txt plus the pinned thirdparty/
# packages, not from this list. See README.md.
dependencies = []

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"



[tool.setuptools.packages.find]
include = ["lexisg*"]

[tool.ruff]
line-length = 88
respect-gitignore = false
target-version = "py311"
# lint.select = [
#     "E",  # pycodestyle errors.
#     "F",  # Pyflakes rules.
#     "I",  # isort formatting.
#     "PLC",  # Pylint convention warnings.
#     "PLE",  # Pylint errors.
#     "PLR",  # Pylint refactor recommendations.
#     "PLW",  # Pylint warnings.
# ]
lint.ignore = [
      "E402",  # Module level import not at top of file
#     "E501",  # Line too long.
#     "F722",  # Forward annotation false positive from jaxtyping. Should be caught by pyright.
#     "F821",  # Forward annotation false positive from jaxtyping. Should be caught by pyright.
#     "PLR2004",  # Magic value used in comparison.
#     "PLR0915",  # Too many statements.
#     "PLR0913",  # Too many arguments.
#     "PLC0414",  # Import alias does not rename variable. (this is used for exporting names)
#     "PLC1901",  # Use falsey strings.
#     "PLR5501",  # Use `elif` instead of `else if`.
#     "PLR0911",  # Too many return statements.
#     "PLR0912",  # Too many branches.
#     "PLW0603",  # Globa statement updates are discouraged.
#     "PLW2901",  # For loop variable overwritten.
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["lexisg"]
split-on-trailing-comma = false
